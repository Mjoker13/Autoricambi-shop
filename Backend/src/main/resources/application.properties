server.port=8080
logging.level.root=INFO

#-------------------------
# Database — variabili d'ambiente (non committare mai valori reali)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/auto_ricambi
spring.datasource.username=${MYUSER:root}
spring.datasource.password=${MYPSW:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#-------------------------
# JPA — update crea la tabella users senza toccare i dati esistenti
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#-------------------------
# JWT
jwt.secret=${JWT_SECRET:autoricambishop-secret-key-min-32-chars-!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

